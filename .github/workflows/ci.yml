name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, stage]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Load raw data into DuckDB
        run: uv run python scripts/load_raw.py

      - name: dbt deps
        run: uv run dbt deps --project-dir datavault_dbt --profiles-dir .

      - name: dbt build
        run: uv run dbt build --project-dir datavault_dbt --profiles-dir .

      - name: pytest
        run: uv run pytest tests/ -v
